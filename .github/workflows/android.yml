name: Android Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose and Espresso instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            bash scripts/ci-screenshots.sh
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chrauto-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to the latest-debug GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk chrauto-ai-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug chrauto-ai-debug.apk --prerelease --target "${GITHUB_SHA}" \
            --title "Chrauto AI (latest debug build)" \
            --notes "Automatic debug APK built from ${GITHUB_SHA}. Unit and instrumentation tests passed before publishing."
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "chrauto-ai-${TAG}.apk"
          NOTES=".github/release-notes/${TAG}.md"; [ -f "$NOTES" ] || echo "Chrauto AI ${TAG}" > "$NOTES"
          printf '\nSHA-256: `%s`\n' "$(sha256sum chrauto-ai-${TAG}.apk | cut -d' ' -f1)" >> "$NOTES"
          gh release create "$TAG" "chrauto-ai-${TAG}.apk" --title "Chrauto AI ${TAG}" --notes-file "$NOTES" --latest
      - name: Publish UI screenshots for review
        if: always() && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d screenshots ] || exit 0
          zip -qj ui-screenshots.zip screenshots/*.png
          gh release delete ci-screenshots --yes --cleanup-tag || true
          gh release create ci-screenshots ui-screenshots.zip --prerelease --target "${GITHUB_SHA}" \
            --title "CI UI screenshots" --notes "Emulator screenshots from ${GITHUB_SHA} (for review only; not an app build)."
